name: Export DS smoke-test emulator
on:
  push:
    paths:
      - .github/workflows/export-ds-emulator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install packaged libretro DS emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libretro-desmume
          mkdir -p dist
          find /usr/lib -iname '*desmume*libretro*.so' -exec cp {} dist/desmume_libretro.so \;
          test -s dist/desmume_libretro.so
          cp /lib/x86_64-linux-gnu/libtinyxml.so.2.6.2 dist/ || cp /usr/lib/x86_64-linux-gnu/libtinyxml.so.2.6.2 dist/
          ldd dist/desmume_libretro.so
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: psyduck-yellow-ds-emulator
          path: dist/
          retention-days: 1
